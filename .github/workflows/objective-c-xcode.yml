name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Fix Podfile Target & Clean FFmpeg Overrides
        run: |
          # 1. Eliminar Podfile.lock para evitar conflictos de cache
          rm -f ios/Podfile.lock

          # 2. Ajustar el objetivo de despliegue a iOS 13.4 (requerido por React Native 0.74 / Hermes)
          sed -i '' "s/platform :ios, .*/platform :ios, '13.4'/g" ios/Podfile || true

          # 3. Remover cualquier declaración manual de ffmpeg-kit para dejar que autolinking gestione la v6.0
          sed -i '' "/ffmpeg-kit-ios-https/d" ios/Podfile || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install

      - name: Build iOS Workspace
        working-directory: ios
        run: |
          xcodebuild -workspace cuteNTR.xcworkspace \
                     -scheme cuteNTR \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package to .IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r cuteNTR.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuteNTR-ipa
          path: cuteNTR.ipa
