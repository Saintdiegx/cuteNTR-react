name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Fix Podfile Deployment Target & FFmpeg
        run: |
          # 1. Eliminar Podfile.lock para regenerar el árbol de dependencias
          rm -f ios/Podfile.lock

          # 2. Ajustar el objetivo de despliegue a iOS 13.4 (requerido por React Native 0.74 / Hermes)
          sed -i '' "s/platform :ios, .*/platform :ios, '13.4'/g" ios/Podfile || true

          # 3. Forzar el uso de ffmpeg-kit 5.1 que sí tiene binarios descargables
          sed -i '' "s/target 'cuteNTR' do/target 'cuteNTR' do\n  pod 'ffmpeg-kit-ios-https', '5.1'/g" ios/Podfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install

      - name: Build iOS Workspace
        working-directory: ios
        run: |
          xcodebuild -workspace cuteNTR.xcworkspace \
                     -scheme cuteNTR \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package to .IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r cuteNTR.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuteNTR-ipa
          path: cuteNTR.ipa
