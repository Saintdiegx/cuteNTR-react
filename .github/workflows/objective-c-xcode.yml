name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Fix Podfile Target & Patch FFmpeg Podspec Mirror
        run: |
          # 1. Eliminar Podfile.lock para limpiar caché previa
          rm -f ios/Podfile.lock

          # 2. Ajustar la plataforma objetivo a iOS 13.4 (requerida por React Native 0.74 / Hermes)
          sed -i '' "s/platform :ios, .*/platform :ios, '13.4'/g" ios/Podfile || true

          # 3. Restaurar la versión en el podspec de ffmpeg-kit-react-native
          sed -i '' "s/'5\.1'/'6\.0'/g" node_modules/ffmpeg-kit-react-native/ffmpeg-kit-react-native.podspec || true

          # 4. Probar y seleccionar una URL de espejo que responda con HTTP 200
          CANDIDATES=(
            "https://github.com/jake-is-dev/ffmpeg-kit-releases/releases/download/v6.0.LTS/ffmpeg-kit-https-6.0.LTS-ios-xcframework.zip"
            "https://github.com/jake-is-dev/ffmpeg-kit-releases/releases/download/v5.1/ffmpeg-kit-https-5.1-ios-xcframework.zip"
          )

          VALID_URL=""
          for url in "${CANDIDATES[@]}"; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "$url")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              VALID_URL="$url"
              echo "Espejo válido encontrado: $VALID_URL"
              break
            fi
          done

          if [ -z "$VALID_URL" ]; then
            echo "Error: No se encontró ningún espejo activo para FFmpegKit."
            exit 1
          fi

          # 5. Generar el podspec local apuntando a la URL válida
          cat << EOF > ios/ffmpeg-kit-ios-https.podspec
          Pod::Spec.new do |s|
            s.name             = 'ffmpeg-kit-ios-https'
            s.version          = '6.0'
            s.summary          = 'FFmpegKit for iOS (HTTPS package mirror)'
            s.homepage         = 'https://github.com/arthenica/ffmpeg-kit'
            s.license          = { :type => 'LGPL-3.0' }
            s.author           = { 'Taner Sener' => 'tanersener@gmail.com' }
            s.platform         = :ios, '12.1'
            s.source           = { :http => '$VALID_URL' }
            s.vendored_frameworks = 'ffmpegkit.xcframework', 'libavcodec.xcframework', 'libavdevice.xcframework', 'libavfilter.xcframework', 'libavformat.xcframework', 'libavutil.xcframework', 'libswresample.xcframework', 'libswscale.xcframework'
          end
          EOF

          # 6. Inyectar la dependencia local en el Podfile
          if ! grep -q "ffmpeg-kit-ios-https" ios/Podfile; then
            sed -i '' "s/target 'cuteNTR' do/target 'cuteNTR' do\n  pod 'ffmpeg-kit-ios-https', :podspec => '.\/ffmpeg-kit-ios-https.podspec'/g" ios/Podfile
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install

      - name: Build iOS Workspace
        working-directory: ios
        run: |
          xcodebuild -workspace cuteNTR.xcworkspace \
                     -scheme cuteNTR \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package to .IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r cuteNTR.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuteNTR-ipa
          path: cuteNTR.ipa
